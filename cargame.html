<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Apex Racer 3D - Points & Hurdles</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    body {
      background: #0b0e14;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* HUD Elements */
    #hud {
      position: absolute;
      top: 18px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }
    .hud-box {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      padding: 10px 18px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    .hud-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #94a3b8;
      margin-bottom: 2px;
    }
    .hud-value {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1px;
    }
    #score-val { color: #38bdf8; }
    #coins-val { color: #facc15; }

    /* Health Bar */
    .health-container {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }
    .heart {
      width: 16px;
      height: 16px;
      background: #ef4444;
      border-radius: 3px;
      transition: opacity 0.3s;
    }
    .heart.lost {
      opacity: 0.2;
    }

    /* Speedometer */
    #speedo {
      position: absolute;
      bottom: 25px;
      left: 25px;
      z-index: 10;
      pointer-events: none;
    }
    .speed-num {
      font-size: 34px;
      font-weight: 900;
      color: #fff;
    }
    .speed-unit {
      font-size: 13px;
      color: #64748b;
      margin-left: 4px;
    }

    /* Mobile Controls */
    #touch-controls {
      position: absolute;
      bottom: 25px;
      right: 25px;
      display: flex;
      gap: 14px;
      z-index: 15;
    }
    .touch-btn {
      width: 65px;
      height: 65px;
      background: rgba(30, 41, 59, 0.8);
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      color: #fff;
      font-size: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      cursor: pointer;
      backdrop-filter: blur(6px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    .touch-btn:active {
      background: rgba(56, 189, 248, 0.6);
      transform: scale(0.94);
    }

    /* Modals (Start & Game Over) */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(7, 11, 20, 0.85);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      text-align: center;
      padding: 20px;
    }
    .overlay h1 {
      font-size: 46px;
      font-weight: 900;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 2px;
    }
    .overlay p {
      color: #94a3b8;
      max-width: 400px;
      margin-bottom: 24px;
      line-height: 1.6;
      font-size: 15px;
    }
    .start-btn {
      padding: 14px 44px;
      background: linear-gradient(135deg, #2563eb, #38bdf8);
      border: none;
      border-radius: 30px;
      color: white;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .start-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(37, 99, 235, 0.7);
    }
    .hidden {
      display: none !important;
    }
  </style>
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- 3D Canvas Mount -->
  <div id="canvas-container"></div>

  <!-- HUD Overlay -->
  <div id="hud">
    <div class="hud-box">
      <div class="hud-title">Score</div>
      <div class="hud-value" id="score-val">0</div>
    </div>
    <div class="hud-box">
      <div class="hud-title">Coins</div>
      <div class="hud-value" id="coins-val">0</div>
    </div>
    <div class="hud-box">
      <div class="hud-title">Durability</div>
      <div class="health-container">
        <div class="heart" id="h1"></div>
        <div class="heart" id="h2"></div>
        <div class="heart" id="h3"></div>
      </div>
    </div>
  </div>

  <div id="speedo" class="hud-box">
    <span class="speed-num" id="speed-val">0</span>
    <span class="speed-unit">KM/H</span>
  </div>

  <!-- Touch Controls -->
  <div id="touch-controls">
    <button class="touch-btn" id="btn-left">◀</button>
    <button class="touch-btn" id="btn-right">▶</button>
  </div>

  <!-- Start Screen -->
  <div class="overlay" id="start-screen">
    <h1>TURBO DRIFT 3D</h1>
    <p>Steer through the highway, gather <b>Gold Stars</b> for extra points, and dodge <b>Roadblocks & Spikes</b>. Survive as long as you can!</p>
    <p style="font-size: 13px; color: #64748b;">Controls: <b>A / D</b> or <b>Left / Right Arrow Keys</b></p>
    <button class="start-btn" id="btn-start">START RACE</button>
  </div>

  <!-- Game Over Screen -->
  <div class="overlay hidden" id="game-over-screen">
    <h1 style="background: linear-gradient(135deg, #ef4444, #f97316); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">CAR TOTALED!</h1>
    <p>You crashed too many times on the expressway.</p>
    <div style="margin-bottom: 24px;">
      <div style="color: #94a3b8; font-size: 13px;">FINAL SCORE</div>
      <div id="final-score" style="font-size: 42px; font-weight: 900; color: #38bdf8;">0</div>
    </div>
    <button class="start-btn" id="btn-restart">PLAY AGAIN</button>
  </div>

  <script>
    /* =========================================================================
       1. SYNTHETIC AUDIO ENGINE (Web Audio API)
       ========================================================================= */
    const AudioEngine = {
      ctx: null,
      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
      },
      playCoinSound() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, this.ctx.currentTime); // A5
        osc.frequency.exponentialRampToValueAtTime(1760, this.ctx.currentTime + 0.12); // A6
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.18);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.18);
      },
      playCrashSound() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(140, this.ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(30, this.ctx.currentTime + 0.28);
        gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.32);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.32);
      }
    };

    /* =========================================================================
       2. THREE.JS SCENE SETUP
       ========================================================================= */
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0f1d);
    scene.fog = new THREE.FogExp2(0x0a0f1d, 0.008);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // Lighting
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x1e293b, 0.7);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
    sunLight.position.set(10, 40, 20);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 1024;
    sunLight.shadow.mapSize.height = 1024;
    scene.add(sunLight);

    /* =========================================================================
       3. ROAD & ENVIRONMENT
       ========================================================================= */
    const ROAD_WIDTH = 14;
    const ROAD_LENGTH = 400;

    // Road Mesh
    const roadGeo = new THREE.PlaneGeometry(ROAD_WIDTH, ROAD_LENGTH);
    const roadMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 });
    const road = new THREE.Mesh(roadGeo, roadMat);
    road.rotation.x = -Math.PI / 2;
    road.receiveShadow = true;
    scene.add(road);

    // Road Stripes
    const stripeGroup = new THREE.Group();
    const stripeGeo = new THREE.PlaneGeometry(0.35, 4);
    const stripeMat = new THREE.MeshBasicMaterial({ color: 0xf8fafc });
    const STRIPE_COUNT = 30;
    const STRIPE_SPACING = ROAD_LENGTH / STRIPE_COUNT;

    for (let i = 0; i < STRIPE_COUNT; i++) {
      const stripeL = new THREE.Mesh(stripeGeo, stripeMat);
      stripeL.rotation.x = -Math.PI / 2;
      stripeL.position.set(-ROAD_WIDTH / 4, 0.02, -i * STRIPE_SPACING);
      stripeGroup.add(stripeL);

      const stripeR = new THREE.Mesh(stripeGeo, stripeMat);
      stripeR.rotation.x = -Math.PI / 2;
      stripeR.position.set(ROAD_WIDTH / 4, 0.02, -i * STRIPE_SPACING);
      stripeGroup.add(stripeR);
    }
    scene.add(stripeGroup);

    // Side Barriers (Curbs)
    const curbGeo = new THREE.BoxGeometry(0.8, 0.6, ROAD_LENGTH);
    const curbMat = new THREE.MeshStandardMaterial({ color: 0x3b82f6 });
    const leftCurb = new THREE.Mesh(curbGeo, curbMat);
    leftCurb.position.set(-ROAD_WIDTH / 2 - 0.4, 0.3, -ROAD_LENGTH / 2);
    const rightCurb = new THREE.Mesh(curbGeo, curbMat);
    rightCurb.position.set(ROAD_WIDTH / 2 + 0.4, 0.3, -ROAD_LENGTH / 2);
    scene.add(leftCurb);
    scene.add(rightCurb);

    // Distant City Skyline
    const cityGroup = new THREE.Group();
    const bldgMat = new THREE.MeshBasicMaterial({ color: 0x111827 });
    for (let i = 0; i < 40; i++) {
      const h = 20 + Math.random() * 50;
      const w = 8 + Math.random() * 8;
      const bldgGeo = new THREE.BoxGeometry(w, h, w);
      const bldg = new THREE.Mesh(bldgGeo, bldgMat);
      const side = Math.random() > 0.5 ? 1 : -1;
      bldg.position.set(side * (25 + Math.random() * 40), h / 2, -Math.random() * ROAD_LENGTH);
      cityGroup.add(bldg);
    }
    scene.add(cityGroup);

    /* =========================================================================
       4. CAR MODEL CREATION
       ========================================================================= */
    function createSportsCar() {
      const car = new THREE.Group();

      // Lower Chassis
      const bodyGeo = new THREE.BoxGeometry(2.2, 0.6, 4.4);
      const bodyMat = new THREE.MeshStandardMaterial({
        color: 0x0ea5e9, // Electric cyan
        roughness: 0.3,
        metalness: 0.8
      });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 0.5;
      body.castShadow = true;
      car.add(body);

      // Cabin / Cockpit
      const cabinGeo = new THREE.BoxGeometry(1.7, 0.55, 2.2);
      const cabinMat = new THREE.MeshStandardMaterial({
        color: 0x020617,
        roughness: 0.1,
        metalness: 0.9
      });
      const cabin = new THREE.Mesh(cabinGeo, cabinMat);
      cabin.position.set(0, 0.95, -0.2);
      cabin.castShadow = true;
      car.add(cabin);

      // Wheels
      const wheelGeo = new THREE.CylinderGeometry(0.42, 0.42, 0.35, 16);
      const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.9 });
      const wheelOffsets = [
        [-1.15, 0.42, 1.3],
        [1.15, 0.42, 1.3],
        [-1.15, 0.42, -1.3],
        [1.15, 0.42, -1.3]
      ];
      wheelOffsets.forEach(pos => {
        const wheel = new THREE.Mesh(wheelGeo, wheelMat);
        wheel.rotation.z = Math.PI / 2;
        wheel.position.set(pos[0], pos[1], pos[2]);
        wheel.castShadow = true;
        car.add(wheel);
      });

      // Headlights & Tail lights
      const lightGeo = new THREE.BoxGeometry(0.4, 0.15, 0.1);
      const headMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
      const hlL = new THREE.Mesh(lightGeo, headMat);
      hlL.position.set(-0.7, 0.55, -2.2);
      const hlR = hlL.clone();
      hlR.position.x = 0.7;
      car.add(hlL, hlR);

      const tailMat = new THREE.MeshBasicMaterial({ color: 0xef4444 });
      const tlL = new THREE.Mesh(lightGeo, tailMat);
      tlL.position.set(-0.7, 0.55, 2.2);
      const tlR = tlL.clone();
      tlR.position.x = 0.7;
      car.add(tlL, tlR);

      return car;
    }

    const playerCar = createSportsCar();
    playerCar.position.set(0, 0, 0);
    scene.add(playerCar);

    /* =========================================================================
       5. POINTS & HURDLES SPAWNING SYSTEM
       ========================================================================= */
    const activeCoins = [];
    const activeHurdles = [];

    // Coin Mesh (Spinning Star Coin)
    function createCoinMesh() {
      const geo = new THREE.CylinderGeometry(0.7, 0.7, 0.2, 12);
      const mat = new THREE.MeshStandardMaterial({
        color: 0xfacc15,
        metalness: 0.9,
        roughness: 0.2,
        emissive: 0xca8a04,
        emissiveIntensity: 0.4
      });
      const coin = new THREE.Mesh(geo, mat);
      coin.rotation.x = Math.PI / 2;
      return coin;
    }

    // Hurdle Mesh (Roadblock Barricade or Traffic Cone)
    function createHurdleMesh(type = 'block') {
      const hurdleGroup = new THREE.Group();
      if (type === 'block') {
        const blockGeo = new THREE.BoxGeometry(2.8, 1.2, 0.8);
        const blockMat = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.5 });
        const block = new THREE.Mesh(blockGeo, blockMat);
        block.position.y = 0.6;
        block.castShadow = true;
        hurdleGroup.add(block);

        // Hazard Stripes
        const stripe = new THREE.Mesh(
          new THREE.BoxGeometry(2.82, 0.3, 0.82),
          new THREE.MeshBasicMaterial({ color: 0xffffff })
        );
        stripe.position.y = 0.6;
        hurdleGroup.add(stripe);
      } else {
        // Traffic Cone
        const coneGeo = new THREE.ConeGeometry(0.6, 1.5, 12);
        const coneMat = new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.4 });
        const cone = new THREE.Mesh(coneGeo, coneMat);
        cone.position.y = 0.75;
        cone.castShadow = true;
        hurdleGroup.add(cone);
      }
      return hurdleGroup;
    }

    // Lanes definition
    const LANES = [-4.5, -1.8, 1.8, 4.5];

    function spawnGameElements() {
      // Spawn items far in front of car
      const spawnZ = playerCar.position.z - 160;

      // Decide randomly to spawn a Hurdle, Coin, or both in separate lanes
      const availableLanes = [...LANES].sort(() => 0.5 - Math.random());

      // 70% chance to spawn hurdle
      if (Math.random() < 0.75) {
        const lane = availableLanes.pop();
        const hurdleMesh = createHurdleMesh(Math.random() > 0.4 ? 'block' : 'cone');
        hurdleMesh.position.set(lane, 0, spawnZ);
        scene.add(hurdleMesh);
        activeHurdles.push(hurdleMesh);
      }

      // 60% chance to spawn gold points
      if (Math.random() < 0.65) {
        const lane = availableLanes.pop();
        const coin = createCoinMesh();
        coin.position.set(lane, 0.8, spawnZ);
        scene.add(coin);
        activeCoins.push(coin);
      }
    }

    /* =========================================================================
       6. GAME STATE & CONTROLS
       ========================================================================= */
    const GameState = {
      RUNNING: false,
      score: 0,
      coins: 0,
      health: 3,
      speed: 0,
      maxSpeed: 85,
      carX: 0,
      carXVelocity: 0,
      lastSpawnZ: 0,
      shakeIntensity: 0
    };

    const keys = { left: false, right: false };

    window.addEventListener('keydown', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
    });

    // Touch controls
    const btnLeft = document.getElementById('btn-left');
    const btnRight = document.getElementById('btn-right');

    const bindTouch = (btn, dir) => {
      btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[dir] = true; });
      btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[dir] = false; });
      btn.addEventListener('mousedown', () => keys[dir] = true);
      btn.addEventListener('mouseup', () => keys[dir] = false);
      btn.addEventListener('mouseleave', () => keys[dir] = false);
    };
    bindTouch(btnLeft, 'left');
    bindTouch(btnRight, 'right');

    /* =========================================================================
       7. CORE GAME LOOP & COLLISION LOGIC
       ========================================================================= */
    const scoreValEl = document.getElementById('score-val');
    const coinsValEl = document.getElementById('coins-val');
    const speedValEl = document.getElementById('speed-val');
    const finalScoreEl = document.getElementById('final-score');

    function updateHealthUI() {
      for (let i = 1; i <= 3; i++) {
        const heartEl = document.getElementById(`h${i}`);
        if (i > GameState.health) {
          heartEl.classList.add('lost');
        } else {
          heartEl.classList.remove('lost');
        }
      }
    }

    function triggerCrash() {
      AudioEngine.playCrashSound();
      GameState.health--;
      GameState.speed = Math.max(GameState.speed * 0.4, 20); // abrupt speed drop
      GameState.shakeIntensity = 0.5; // camera tremor
      updateHealthUI();

      if (GameState.health <= 0) {
        gameOver();
      }
    }

    function collectCoin(coin, index) {
      AudioEngine.playCoinSound();
      GameState.coins += 1;
      GameState.score += 50;
      coinsValEl.textContent = GameState.coins;
      scoreValEl.textContent = Math.floor(GameState.score);

      // Flash remove
      scene.remove(coin);
      activeCoins.splice(index, 1);
    }

    function gameOver() {
      GameState.RUNNING = false;
      finalScoreEl.textContent = Math.floor(GameState.score);
      document.getElementById('game-over-screen').classList.remove('hidden');
    }

    function resetGame() {
      GameState.RUNNING = true;
      GameState.score = 0;
      GameState.coins = 0;
      GameState.health = 3;
      GameState.speed = 0;
      GameState.carX = 0;
      GameState.carXVelocity = 0;
      GameState.lastSpawnZ = 0;
      GameState.shakeIntensity = 0;

      playerCar.position.set(0, 0, 0);
      playerCar.rotation.set(0, 0, 0);

      // Clear existing obstacles and coins
      activeCoins.forEach(c => scene.remove(c));
      activeHurdles.forEach(h => scene.remove(h));
      activeCoins.length = 0;
      activeHurdles.length = 0;

      scoreValEl.textContent = '0';
      coinsValEl.textContent = '0';
      speedValEl.textContent = '0';
      updateHealthUI();

      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('game-over-screen').classList.add('hidden');
    }

    document.getElementById('btn-start').addEventListener('click', () => {
      AudioEngine.init();
      resetGame();
    });
    document.getElementById('btn-restart').addEventListener('click', () => {
      AudioEngine.init();
      resetGame();
    });

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = Math.min(clock.getDelta(), 0.1);

      if (GameState.RUNNING) {
        // 1. Forward Speed & Acceleration
        if (GameState.speed < GameState.maxSpeed) {
          GameState.speed += 22 * delta;
        }
        const forwardStep = (GameState.speed * 0.45) * delta;
        playerCar.position.z -= forwardStep;
        GameState.score += forwardStep * 0.8;
        scoreValEl.textContent = Math.floor(GameState.score);
        speedValEl.textContent = Math.floor(GameState.speed * 1.5);

        /// --- REPLACE THIS IN YOUR animate() FUNCTION ---

// 2. Horizontal Steering & Physics (Smoothed)
const steerAcceleration = 45.0; // How quickly steering responds
const maxSteerSpeed = 16.0;      // Maximum sideways glide speed
const friction = 0.88;          // Smooth glide damping

if (keys.left) {
  GameState.carXVelocity = Math.max(GameState.carXVelocity - steerAcceleration * delta, -maxSteerSpeed);
} else if (keys.right) {
  GameState.carXVelocity = Math.min(GameState.carXVelocity + steerAcceleration * delta, maxSteerSpeed);
} else {
  GameState.carXVelocity *= Math.pow(friction, delta * 60); // Clean return to center
}

GameState.carX += GameState.carXVelocity * delta;

// Road boundaries clamp
const maxCarX = ROAD_WIDTH / 2 - 1.6;
if (GameState.carX < -maxCarX) {
  GameState.carX = -maxCarX;
  GameState.carXVelocity = 0;
}
if (GameState.carX > maxCarX) {
  GameState.carX = maxCarX;
  GameState.carXVelocity = 0;
}

playerCar.position.x = GameState.carX;

// Subtle steering angle (Y = yaw/turn, Z = slight lean without wheel lift)
playerCar.rotation.y = -GameState.carXVelocity * 0.02; // Points nose into turn
playerCar.rotation.z = GameState.carXVelocity * 0.003; // Tiny body lean (no lifting)

        // 3. Infinite Road & Element Recycling
        road.position.z = playerCar.position.z - 100;
        leftCurb.position.z = playerCar.position.z - 100;
        rightCurb.position.z = playerCar.position.z - 100;

        // Shift stripes dynamically
        stripeGroup.children.forEach(stripe => {
          if (stripe.position.z > playerCar.position.z + 20) {
            stripe.position.z -= ROAD_LENGTH;
          }
        });

        // 4. Procedural Spawning
        if (playerCar.position.z - GameState.lastSpawnZ < -24) {
          spawnGameElements();
          GameState.lastSpawnZ = playerCar.position.z;
        }

        // 5. Coins Animation & Collision Check
        for (let i = activeCoins.length - 1; i >= 0; i--) {
          const coin = activeCoins[i];
          coin.rotation.z += 3.5 * delta;

          // Check distance to car
          const dist = playerCar.position.distanceTo(coin.position);
          if (dist < 2.0) {
            collectCoin(coin, i);
          } else if (coin.position.z > playerCar.position.z + 15) {
            // Clean up old passed coin
            scene.remove(coin);
            activeCoins.splice(i, 1);
          }
        }

        // 6. Hurdles Collision Check
        for (let i = activeHurdles.length - 1; i >= 0; i--) {
          const hurdle = activeHurdles[i];
          const dist = playerCar.position.distanceTo(hurdle.position);

          // Bounding box approximation
          const dx = Math.abs(playerCar.position.x - hurdle.position.x);
          const dz = Math.abs(playerCar.position.z - hurdle.position.z);

          if (dx < 2.0 && dz < 2.2) {
            triggerCrash();
            // Remove hurdle so it doesn't collide multiple times
            scene.remove(hurdle);
            activeHurdles.splice(i, 1);
          } else if (hurdle.position.z > playerCar.position.z + 15) {
            scene.remove(hurdle);
            activeHurdles.splice(i, 1);
          }
        }

        // 7. Dynamic Camera Follow with Screen Shake
        const targetCamX = playerCar.position.x * 0.65;
        const targetCamY = playerCar.position.y + 4.5;
        const targetCamZ = playerCar.position.z + 8.5;

        camera.position.x += (targetCamX - camera.position.x) * 0.12;
        camera.position.y += (targetCamY - camera.position.y) * 0.12;
        camera.position.z += (targetCamZ - camera.position.z) * 0.2;

        if (GameState.shakeIntensity > 0) {
          camera.position.x += (Math.random() - 0.5) * GameState.shakeIntensity;
          camera.position.y += (Math.random() - 0.5) * GameState.shakeIntensity;
          GameState.shakeIntensity *= 0.88;
        }

        camera.lookAt(playerCar.position.x * 0.3, playerCar.position.y + 1.2, playerCar.position.z - 15);
      } else {
        // Idle camera rotation on menu
        camera.position.x = Math.sin(Date.now() * 0.0008) * 8;
        camera.position.y = 5;
        camera.position.z = 10;
        camera.lookAt(0, 0, -5);
      }

      renderer.render(scene, camera);
    }

    // Responsive Resizing
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Begin render loop
    animate();
  </script>
</body>
</html>
